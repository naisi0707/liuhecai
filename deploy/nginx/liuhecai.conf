# Upstream backends (loopback only)
upstream liuhecai_web {
    server 127.0.0.1:3000;
    keepalive 8;
}
upstream liuhecai_admin {
    server 127.0.0.1:3001;
    keepalive 4;
}
upstream liuhecai_agent {
    server 127.0.0.1:3002;
    keepalive 4;
}
upstream liuhecai_api {
    server 127.0.0.1:8080;
    keepalive 8;
}

map $host $liuhecai_http_upstream {
    default                 liuhecai_web;
    admin.236841.xyz        liuhecai_admin;
    agent.236841.xyz        liuhecai_agent;
}

# Shared proxy snippets via include-like duplication (nginx 1.14 friendly)

# --- HTTP: ACME + redirect for certed hosts; plain proxy for uncerted ---
server {
    listen 80;
    listen [::]:80;
    server_name 585520.xyz 785412.xyz 658951.xyz 152687.xyz 746528.xyz;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name 157465.com www.157465.com admin.236841.xyz agent.236841.xyz;

    client_max_body_size 4m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location /api/ {
        proxy_pass http://liuhecai_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
    }

    location /uploads/ {
        proxy_pass http://liuhecai_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://$liuhecai_http_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# --- HTTPS forum domains (one cert each) ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 585520.xyz;
    ssl_certificate /etc/letsencrypt/live/585520.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/585520.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 4m;

    location /api/ {
        proxy_pass http://liuhecai_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
    }
    location /uploads/ {
        proxy_pass http://liuhecai_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location / {
        proxy_pass http://liuhecai_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

