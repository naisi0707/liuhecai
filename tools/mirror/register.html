            try {
                
                const val2 = atob(val);
                const str = new Uint8Array(val2.split('').map(c => c.charCodeAt(0)));
                const str2 = new TextDecoder("GBK").decode(str);
                const inObj = document.getElementById(obj);
                if (inObj) inObj.innerHTML += str2;
            } catch {}
        }else{
            return '';
        }
    }
