<script>
    function decrypt(obj,val) {
        if(obj && val){
            try {
                
                const val2 = atob(val);
                const str = new Uint8Array(val2.split('').map(c => c.charCodeAt(0)));
                const str2 = new TextDecoder("GBK").decode(str);
                const inObj = document.getElementById(obj);
                if (inObj) inObj.innerHTML += str2;
            } catch {}
        }else{
            return '';
        }
    }
	function decrypt1(obj) {
        if(obj){
            try {
                const inObj = document.getElementById(obj);
                const val2 = atob(inObj.innerHTML);
                const str = new Uint8Array(val2.split('').map(c => c.charCodeAt(0)));
                const str2 = new TextDecoder("GBK").decode(str);                
                inObj.innerHTML = str2;
            } catch {}
        }else{
            return '';
        }
    }
    function decrypt2(val) {
        if(val){
            try {
                
                const val2 = atob(val);
                const str = new Uint8Array(val2.split('').map(c => c.charCodeAt(0)));
                const str2 = new TextDecoder("GBK").decode(str);
                return str2;
            } catch {}
        }else{
            return '';
        }
    }
    document.title=decrypt2('wfWyrs7CwtvMsw==');
